# Publishes the built site to GitHub Pages. The daily schedule exists so
# build-time data (the repos.json that org discovery writes) stays fresh even
# when nothing lands on main.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Writes public/repos.json, which Vite copies into the site. A failure
      # fails the deploy: shipping an empty side panel would look like an org
      # with no dev systems. The token only raises the rate limit; private
      # repos are left out of the file regardless.
      - run: npm run discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
